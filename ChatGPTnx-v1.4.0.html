(--knob); height:var(--knob); display:block; margin:0;\n  border-radius:calc(var(--knob) * var(--control-radius-ratio)); background:#fff; box-shadow:var(--shadow-knob);\n  transform:translate(0,-50%); transition:transform 200ms var(--ease);\n}\n.switch[aria-checked=\"true\"] { background:var(--action); }\n.switch[aria-checked=\"true\"] i { transform:translate(calc(var(--switch-width) - var(--knob) - 2 * var(--inset)),-50%); background:var(--action-ink); }\n/* A flat record has one full-width hover owner, even when it contains actions. */\n.interaction-row { transition:background 160ms var(--ease),box-shadow 160ms var(--ease); }\n.interaction-row:hover { position:relative; z-index:1; background:var(--control-hover-surface); box-shadow:var(--hover-shadow); }\nbutton.control--embedded { border-radius:0; border:0; }\nbutton.control--embedded::after { display:none; }\nbutton.control--embedded:hover:not(:disabled) { background:transparent; box-shadow:none; }\nbutton.control--embedded:focus-visible { outline-offset:-2px; }\n.control-header { border-radius:var(--radius-card); }\n.control-container:has(> .control-header:hover) { box-shadow:var(--hover-shadow); }\n.control-container > .control-header:hover { box-shadow:none; }\n.control-container:has(> .control-header[aria-expanded=\"true\"]) > .control-header {\n  border-bottom-left-radius:0; border-bottom-right-radius:0;\n}\n/* NX-CONTROLS-END */\n.fill { width: 100%; }\n.sheet-body.purchase-body { display: flex; flex-direction: column; gap: 0; padding: 0 20px 20px; }\n.purchase-contact { flex: 1; min-height: 0; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; }\n.purchase-contact h3 { font-size: 24px; line-height: 32px; font-weight: 650; letter-spacing: -.2px; }\n.purchase-services { margin-top: 6px; color: var(--muted); font-size: 11px; line-height: 18px; }\n.purchase-number { display: flex; align-items: baseline; justify-content: center; gap: 7px; margin-top: 24px; async function runAudit(kind){
  if(auditBusy)return; auditBusy=true;
  const original=selected,originalTheme=theme,locks=[...document.querySelectorAll('button,select,input')].filter(n=>!n.disabled);
  locks.forEach(n=>n.disabled=true);
  auditResult={kind,source_digest:sourceDigest,started:new Date().toISOString(),records:[],problems:[]};
  const items=kind==='layout'?catalog:motionFlows,total=items.length*2;
  try{
    for(const palette of ['light','dark']){
      theme=palette;
      for(const item of items){
        const scene=kind==='layout'?item:catalog.find(c=>c.id===item.id);
        $('#audit-status').textContent='检查中 '+(auditResult.records.length+1)+' / '+total+' · '+palette+' · '+scene.label;
        await auditLoad(scene);
        const result=await awaitAudit('audit-'+kind,kind==='motion'?item.steps:null);
        const problems=kind==='layout'?[...result.problems,...(result.page!==scene.expected?['页面不符：'+result.page]:[])]:result.flatMap(r=>r.problems.map(p=>r.step+'：'+p));
        auditResult.records.push({theme:palette,id:scene.id,result,problems});
        auditResult.problems.push(...problems.map(p=>palette+' / '+scene.id+' / '+p));
      }
    }
    if(kind==='layout'){
      for(const palette of ['light','dark']){
        const records=auditResult.records.filter(r=>r.theme===palette),compare=(left,right,keys)=>{
          for(const key of keys){const a=left?.result.regions[key],b=right?.result.regions[key];if(a&&b&&['x','y','w','h','font'].some(k=>Math.abs(a[k]-b[k])>.5))auditResult.problems.push(palette+' / 固定布局变化 / '+left.id+' → '+right.id+' / '+key);}
        };
        compare(records.find(r=>r.id==='home-four'),records.find(r=>r.id==='home-many'),['.header','.current-card','.relay','.section-link','.account-list','.row','.row .avatar','.footer']);
        const update=records.find(r=>r.id==='version-update');
        for(const record of records.filter(r=>r.id.startsWith('version-update-')))compare(update,record,['.update-identity','.update-mark','.update-brand','.update-version','.update-github','.update-primary','.update-state','.update-description','.update-footer']);
      }
    }
  }catch(error){auditResult.problems.push(String(error.message||error));}
  finally{
    auditResult.completed=new Date().toISOString();auditResult.passed=auditResult.problems.length===0&&auditResult.records.length===total;
    $('#audit-report').textContent=JSON.stringify(auditResult);
    theme=originalTheme;load(original);locks.forEach(n=>n.disabled=false);auditBusy=false;
    $('#audit-status').textContent=(auditResult.passed?'检查通过':'发现问题')+' · '+auditResult.records.length+' / '+total+' · '+auditResult.problems.length+' 项异常';
    renderDebug();
  }
}
$('#audit-layout').onclick=()=>runAudit('layout');$('#audit-motion').onclick=()=>runAudit('motion');
$('#total').textContent=catalog.length+' 个具名页面 / 状态';$('#native').innerHTML=native.map(n=>`<p><b>${esc(n.surface)}</b><br>${esc(n.verification)}</p>`).join('');load(selected);
</script></body></html>
