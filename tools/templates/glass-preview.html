<!doctype html>
<html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>ChatGPTnx · 玻璃外观预览</title>
<style>
*{box-sizing:border-box}body{margin:0;background:#f5f6f8;color:#202733;font:14px/1.6 'Segoe UI','Microsoft YaHei UI',sans-serif}main{max-width:1150px;margin:auto;padding:46px 36px 30px}.eyebrow{font-size:11px;letter-spacing:2px;color:#7d8796}h1{font-size:32px;font-weight:600;letter-spacing:-1px;line-height:1.25;margin:10px 0 12px}.lead{color:#667181;margin:0;max-width:640px}.toolbar{display:flex;gap:18px;align-items:center;flex-wrap:wrap;padding:23px 0 25px}label{display:flex;gap:8px;align-items:center;font-size:12px;color:#626d7d}select,button{font:inherit;color:#2f3947;background:#fff;border:1px solid #dce1e8;border-radius:9px;padding:7px 12px;cursor:pointer}button[aria-pressed=true]{background:#293343;color:white;border-color:#293343}.themes{display:flex;gap:5px}.panels{display:grid;grid-template-columns:1fr 1fr;gap:26px}.panel{min-width:0}.caption{display:flex;justify-content:space-between;align-items:center;margin:0 2px 10px;font-size:13px}.caption small{color:#7a8492;font-size:11px}.frame-wrap{border:1px solid #e1e5ec;border-radius:22px;overflow:hidden;background:#c4d5e6}iframe{width:100%;height:550px;border:0;display:block}footer{font-size:12px;color:#798391;margin-top:23px}a{color:inherit}.status{margin-top:7px;font-size:11px;color:#7d8796}@media(max-width:760px){main{padding:26px 18px}.panels{grid-template-columns:1fr;gap:22px}.caption small{display:none}h1{font-size:27px}.toolbar{gap:12px}iframe{height:528px}}
@media(max-width:760px){.panel:last-child{order:-1}}
</style></head><body><main><div class="eyebrow">CHATGPTNX / APPEARANCE</div><h1>让面板轻一点。</h1><p class="lead">磨砂的背景，柔和的玻璃边缘。保留熟悉的布局、清晰的文字和黑白主按钮。</p>
<div class="toolbar"><div class="themes" role="group" aria-label="外观"><button data-theme="light" aria-pressed="true">浅色</button><button data-theme="dark" aria-pressed="false">深色</button></div><label>页面<select id="route"><option value="">首页</option><option value="detail">账号详情</option><option value="usage">用量总览</option><option value="settings">设置</option><option value="quota-overview">额度总览</option></select></label><label>宽度<select id="width"><option value="312">312 · 紧凑</option><option value="327">327 · 原宽度</option><option value="300">300</option></select></label><label>背景<select id="backdrop"><option value="dawn">晨光</option><option value="midnight">暮色</option><option value="contrast">明暗交错</option></select></label></div>
<div class="panels"><section class="panel"><div class="caption"><strong>纯色</strong><small>兼容显示</small></div><div class="frame-wrap"><iframe id="solid" title="纯色外观"></iframe></div></section><section class="panel"><div class="caption"><strong>磨砂玻璃</strong><small>半透明底 · 边缘高光</small></div><div class="frame-wrap"><iframe id="glass" title="磨砂玻璃外观"></iframe></div></section></div>
<footer>可直接点击面板体验页面和转场。这里使用合成数据展示外观；桌面背景模糊由独立 Windows 测试窗口验证。</footer><div id="status" class="status" role="status"></div>
</main><script>
const demo=__DEMO__;let theme='light';
function render(){const query=new URLSearchParams({appearance:theme,material:'glass',width:document.querySelector('#width').value,backdrop:document.querySelector('#backdrop').value});const route=document.querySelector('#route').value;if(route)query.set('open',route);for(const material of ['solid','glass']){query.set('material',material);document.getElementById(material).srcdoc=demo.replace('window.NX_CONFIG=',`window.NX_PREVIEW_QUERY=${JSON.stringify('?'+query)};window.NX_CONFIG=`)}document.querySelectorAll('[data-theme]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.theme===theme)));}
document.querySelectorAll('[data-theme]').forEach(b=>b.onclick=()=>{theme=b.dataset.theme;render()});document.querySelectorAll('select').forEach(s=>s.onchange=render);render();
</script></body></html>
