*{box-sizing:border-box} :root{font-family:'Segoe UI','Microsoft YaHei UI',sans-serif;color:#202329;background:#f3f4f6;font-size:13px;color-scheme:light}body{margin:0}button,input{font:inherit}button{cursor:pointer;border:1px solid #dde0e5;border-radius:9px;background:#fff;color:inherit;padding:9px 12px}button:hover{background:#edf0f3}button:focus-visible,input:focus-visible,a:focus-visible{outline:2px solid #42648e;outline-offset:2px}button:disabled{opacity:.45;cursor:default}header{height:70px;background:#fff;border-bottom:1px solid #dde0e5;display:flex;align-items:center;justify-content:space-between;padding:0 24px;gap:16px}header strong{font-size:17px;letter-spacing:-.4px}header small{color:#686e77;margin-left:12px}.tag{display:inline-flex;border-radius:20px;background:#eef0f3;padding:4px 8px;font-size:11px}header .actions{display:flex;align-items:center;gap:8px}.layout{display:grid;grid-template-columns:292px minmax(400px,1fr) 260px;min-height:calc(100vh - 70px)}aside{background:#fff;padding:20px 14px;overflow:auto;max-height:calc(100vh - 70px)}.nav{border-right:1px solid #dde0e5}.nav input{width:100%;border:1px solid #dde0e5;border-radius:10px;padding:10px;margin-bottom:14px}.nav h2{font-size:11px;color:#69707c;font-weight:600;padding:0 10px;margin:20px 0 7px}.nav button{display:block;width:100%;text-align:left;background:none;border:0;font-size:12px;padding:9px 10px;margin:2px 0}.nav button[aria-current="true"]{background:#202329;color:#fff}.nav button small{display:block;opacity:.6;margin-top:4px;font-size:10px}.stage{display:flex;align-items:center;flex-direction:column;min-width:0;padding:22px 12px 26px}.stage-top{display:flex;gap:8px;align-items:center;justify-content:center;margin-bottom:14px}.stage-top span{font-size:12px;color:#686e77;font-variant-numeric:tabular-nums;min-width:64px;text-align:center}#frame{border:0;width:100%;max-width:540px;height:610px;flex-shrink:0;background:transparent}#caption{color:#656c76;font-size:12px;text-align:center;max-width:450px;line-height:1.7}.inspector{border-left:1px solid #dde0e5;padding:24px 18px}.inspector .eyebrow{font-size:10px;letter-spacing:.7px;color:#7a8089}.inspector h1{font-size:21px;line-height:1.45;margin:12px 0}.inspector p{font-size:12px;line-height:1.8;color:#68707a;overflow-wrap:anywhere}.inspector h2{font-size:13px;margin:26px 0 12px}.inspector button{width:100%;text-align:left;margin:4px 0}.inspector .meta{font:11px/1.8 Consolas,monospace;color:#7a8089;overflow-wrap:anywhere}.inspector hr{border:0;border-top:1px solid #e7e9ee;margin:22px 0}.status{display:block;border:1px solid #e2e6eb;border-radius:10px;padding:10px 12px;background:#f7f8fa;color:#555d69;font-size:11px;line-height:1.7;white-space:pre-line}.status.error{color:#a13d36;background:#fff3f1}.theme[aria-pressed="true"]{background:#202329;color:#fff;border-color:#202329}.intro{padding:12px;background:#f3f5f7;border-radius:10px;font-size:11px;line-height:1.75;color:#606872}.native details{margin-top:10px}.native summary{font-size:12px;cursor:pointer}.native p{font-size:11px}a{color:inherit}@media(max-width:1050px){.layout{grid-template-columns:250px minmax(380px,1fr)}.inspector{grid-column:1/-1;max-height:none;border-top:1px solid #dde0e5;display:grid;grid-template-columns:1fr 1fr;gap:0 26px}.inspector h1{font-size:18px}aside.nav{max-height:750px}.stage{padding-left:0;padding-right:0}}@media(max-width:650px){header{height:auto;min-height:80px;padding:14px;flex-wrap:wrap}.layout{display:flex;flex-direction:column}.nav{max-height:220px!important;border-bottom:1px solid #ddd}.stage{padding-top:12px}#frame{height:570px}.inspector{display:block}.stage-top{margin-bottom:0}header small{display:block;margin:4px 0}}

.quick{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:14px}.quick button{font-size:11px;padding:7px 9px}
#frame-holder{width:calc(327px * var(--preview-scale,1));height:calc(458px * var(--preview-scale,1));flex-shrink:0}
#frame{display:block;width:327px!important;max-width:none;height:458px!important;transform:scale(var(--preview-scale,1));transform-origin:top left}
#scale{font:inherit;padding:7px;border:1px solid #dde0e5;border-radius:8px;background:#fff;color:inherit}
#debug-info{font:10px/1.7 Consolas,monospace;white-space:pre-wrap;overflow-wrap:anywhere;background:#f3f4f6;padding:10px;border-radius:8px}
.stage{height:calc(100vh - 70px);overflow:auto}
.stage-top{flex-shrink:0;flex-wrap:wrap}

#frame-holder{margin-top:auto}#caption{margin-bottom:auto;flex-shrink:0}
.panel-focus .stage{height:auto;overflow:visible}.panel-focus .panel-stage{display:block}
#back-console{display:none}.panel-focus header,.panel-focus .nav,.panel-focus .inspector,.panel-focus .stage-top,.panel-focus #caption{display:none}
.panel-focus .layout{display:block;min-height:0}.panel-focus .stage{display:block;padding:0}.panel-focus #frame-holder{--preview-scale:1;margin:0}

</style></head><body>
<header><div><strong>ChatGPTnx-v__VERSION__</strong><small>演示 · 更新预览 · 调试 / 真实组件 · 离线运行</small></div><div class="actions"><span class="tag" id="total"></span><button class="theme" data-theme="light" aria-pressed="true">浅色</button><button class="theme" data-theme="dark" aria-pressed="false">深色</button></div></header>
<div class="layout"><aside class="nav"><input id="search" type="search" placeholder="搜索页面、状态或路由" aria-label="搜索全部界面"><div class="quick"><button data-jump="home">首页</button><button data-jump="purchase-account">联系与支持</button><button data-jump="version-update">版本更新</button><button data-jump="reauth-login">重新登录</button></div><nav id="nav" aria-label="全部界面"></nav></aside>
<main class="stage"><div class="stage-top"><button id="prev" aria-label="上一个界面">← 上一页</button><span id="position"></span><button id="next" aria-label="下一个界面">下一页 →</button><button id="reset">重置场景</button><label>比例 <select id="scale" aria-label="面板显示比例"><option value="auto" selected>自动适配</option><option value="1">100% · 真实尺寸</option><option value="1.25">125%</option><option value="1.5">150%</option><option value="1.75">175%</option><option value="2">200%</option></select></label><button id="focus-panel">聚焦面板</button></div><div class="panel-stage"><div id="frame-holder"><iframe id="frame" title="ChatGPTnx 可操作演示" sandbox="allow-scripts allow-same-origin" allow="clipboard-write"></iframe></div><p id="caption"></p></div></main>
<aside class="inspector"><div><span class="eyebrow" id="group"></span><h1 id="label"></h1><p class="meta" id="id"></p><p id="note"></p><span class="status" id="status" role="status">正在加载真实组件…</span><hr><div class="intro">所有账号、额度、任务均为合成数据。面板内的按钮、返回、滚动、表单、切换和展开可操作。演示不会访问真实账号、凭据或桌面应用。</div></div><div><h2>模拟外部事件</h2><p>这些按钮只属于演示控制台，不会出现在正式软件里。</p><button data-simulate="login">模拟完成桌面登录</button><button data-simulate="restore-quota">模拟额度恢复</button><button data-simulate="start-resume">模拟接续状态出现</button><button data-simulate="clear-status">清除状态，对照固定外框</button><button data-simulate="complete-resume">模拟接续成功</button><button data-simulate="recover-service">模拟本地服务恢复</button><h2>检查方式</h2><p>通过左侧目录直达每个状态，或直接使用面板内的入口。长名单与展开内容可以滚动。切换目录会重置合成数据，防止上一个状态影响检查。</p><h2>当前场景调试信息</h2><pre id="debug-info"></pre><button id="debug-export">导出调试报告</button><p>报告只包含演示场景、页面状态、尺寸、版本和脚本错误，不读取本机账号。</p><div class="native"><details><summary>Windows 原生界面的验证范围</summary><div id="native"></div></details></div></div></aside></div>
<button id="back-console">返回演示台</button><script>
const sourceDigest="__SOURCE_DIGEST__";
const catalog=__CATALOG__,native=__NATIVE__,demo=__DEMO__;
let runtimeInfo={},runtimeErrors=[],displayedScale=1;
let selected=catalog.find(c=>c.id===decodeURIComponent(location.hash.slice(1)))||catalog.find(c=>c.id==='home'),theme='light';
const $=s=>document.querySelector(s),frame=$('#frame');
function esc(value){return String(value??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));}
function nav(){const q=$('#search').value.trim().toLowerCase();let group='';$('#nav').innerHTML=catalog.filter(c=>[c.group,c.label,c.id,c.route].join(' ').toLowerCase().includes(q)).map(c=>{const heading=c.group!==group?`<h2>${esc(c.group)}</h2>`:'';group=c.group;return heading+`<button data-case="${c.id}" aria-current="${selected.id===c.id}">${esc(c.label)}<small>${esc(c.id)}</small></button>`;}).join('');}
function load(item){selected=item;runtimeInfo={};runtimeErrors=[];try{history.replaceState(null,'','#'+item.id);}catch{}nav();$('#label').textContent=item.label;$('#group').textContent=item.group;$('#id').textContent=item.id+' · route: '+item.route;$('#note').textContent=item.note||'共享正式 UI 组件与交互处理，仅数据和桌面操作使用演示适配器。';$('#status').classList.remove('error');$('#status').textContent='正在载入…';$('#position').textContent=(catalog.indexOf(item)+1)+' / '+catalog.length;
const query='?'+item.query+'&case='+encodeURIComponent(item.id)+'&appearance='+theme;
const init='window.NX_PREVIEW_QUERY='+JSON.stringify(query)+';window.NX_PREVIEW_CASE='+JSON.stringify(item.id)+';window.NX_CONFIG=';
frame.srcdoc=demo.replace('window.NX_CONFIG=',init).replace('</style>','body.demo{padding:0;min-height:0;background:transparent}#app{width:327px!important;box-shadow:none}</style>');renderDebug();fitPreview();}
function command(command,value){frame.contentWindow.postMessage({source:'chatgptnx-explorer',command,value},'*');}
document.addEventListener('click',event=>{const b=event.target.closest('button');if(!b)return;if(b.dataset.case)load(catalog.find(c=>c.id===b.dataset.case));if(b.dataset.jump)load(catalog.find(c=>c.id===b.dataset.jump));if(b.dataset.theme){theme=b.dataset.theme;document.querySelectorAll('[data-theme]').forEach(n=>n.setAttribute('aria-pressed',n.dataset.theme===theme));command('appearance',theme);}if(b.dataset.simulate)command('simulate',b.dataset.simulate);});
$('#search').addEventListener('input',nav);$('#reset').onclick=()=>load(selected);$('#prev').onclick=()=>load(catalog[(catalog.indexOf(selected)+catalog.length-1)%catalog.length]);$('#next').onclick=()=>load(catalog[(catalog.indexOf(selected)+1)%catalog.length]);
window.addEventListener('message',event=>{if(event.source!==frame.contentWindow||event.data?.source!=='chatgptnx-preview')return;const {type,info,message}=event.data;runtimeInfo=info||runtimeInfo;if(type==='error'){runtimeErrors.push(String(message));$('#status').textContent='演示状态异常：'+message;$('#status').classList.add('error');}else{$('#status').classList.remove('error');$('#status').textContent='可操作 · '+(info?.page||'已就绪')+'\n外框 '+info?.width+' × '+info?.height;}renderDebug();});
function debugSnapshot(){return {product:'ChatGPTnx',version:'__VERSION__',source_digest:sourceDigest,case:selected.id,case_label:selected.label,theme,expected:selected.expected,display:{mode:$('#scale').value,scale:document.body.classList.contains('panel-focus')?1:displayedScale},view:runtimeInfo,errors:[...runtimeErrors]};}
function renderDebug(){$('#debug-info').textContent=JSON.stringify(debugSnapshot(),null,2);}
function fitPreview(){
  if(document.body.classList.contains('panel-focus'))return;
  const area=$('.panel-stage'),mode=$('#scale').value;
  displayedScale=mode==='auto'?Math.floor(Math.max(.75,Math.min(2,(area.clientWidth-32)/327,(area.clientHeight-52)/458))*100)/100:Number(mode);
  document.documentElement.style.setProperty('--preview-scale',displayedScale);
  $('#caption').textContent='真实面板 __GEOMETRY__ · '+(mode==='auto'?'自动显示 ':'显示 ')+Math.round(displayedScale*100)+'%';
  renderDebug();
}
$('#scale').onchange=fitPreview;
new ResizeObserver(fitPreview).observe($('.panel-stage'));
$('#focus-panel').onclick=()=>document.body.classList.add('panel-focus');
$('#back-console').onclick=()=>{document.body.classList.remove('panel-focus');fitPreview();};
addEventListener('keydown',event=>{if(event.key==='Escape'){document.body.classList.remove('panel-focus');fitPreview();}});
$('#debug-export').onclick=()=>{const url=URL.createObjectURL(new Blob([JSON.stringify(debugSnapshot(),null,2)],{type:'application/json'})),a=document.createElement('a');a.href=url;a.download='ChatGPTnx-v__VERSION__-'+selected.id+'-debug.json';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000);};
$('#total').textContent=catalog.length+' 个具名页面 / 状态';$('#native').innerHTML=native.map(n=>`<p><b>${esc(n.surface)}</b><br>${esc(n.verification)}</p>`).join('');load(selected);
</script></body></html>
